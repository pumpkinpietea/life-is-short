name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show Apple toolchain
        run: xcodebuild -version && swift --version
      - name: Test countdown, library, storage, and selection rules
        run: swift test --scratch-path "$RUNNER_TEMP/LifeIsShortCore"
      - name: Build iPhone app and embedded widget
        run: >-
          xcodebuild -project LifeIsShort/LifeIsShort.xcodeproj
          -scheme LifeIsShort -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LifeIsShortDerivedData"
          CODE_SIGNING_ALLOWED=NO build
